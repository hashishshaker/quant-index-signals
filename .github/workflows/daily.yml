name: Multi Daily Index Signals

on:
  schedule:
    - cron: "30 6 * * *"   # 12:00 PM IST
    - cron: "30 9 * * *"   # 3:00 PM IST
    - cron: "30 12 * * *"  # 6:00 PM IST
    - cron: "30 15 * * *"  # 9:00 PM IST
  workflow_dispatch:

jobs:
  run-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        run: python run_signals.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add signals_log.csv
          git commit -m "Daily signal update"
          git push
